game:
  rules:
    probability:
      # Same numeric values as game-service's game.rules.scoring.card-shifts/swing-shift — kept in sync
      # manually, no shared config source exists between independently-deployed services.
      push-shift: 20
      suppress-shift: -20
      swing-shift: 30
      floor: 0
      ceiling: 90
    # sagas.md Saga 5 / event-schema.md ParadoxResolutionPhaseStarted.timerSeconds default.
    paradox-resolution-timer-seconds: 60
  timers:
    paradox-resolution-sweep-interval: 1s

spring:
  application:
    name: timeline-service
  jackson:
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:5432}/${SPRING_DATASOURCE_NAME:temporal_rift}?sslmode=require
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    listener:
      observation-enabled: true
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
    consumer:
      # game.events is produced by game-service; timeline-service consumes it as raw JSON and routes by
      # hand until this side is generated-consumer-wired. One consumer group per logical consumer.
      group-id: timeline-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # ByteArraySerializer pairs with the consumer-side ByteArrayJacksonJsonMessageConverter
      # (KafkaConsumerConfig): kafkaTemplate.send(Message<?>) already runs the payload through that
      # converter's RecordMessageConverter#convertPayload (JSON -> byte[]), so the producer's own
      # serializer must pass bytes straight through. Pairing this with JacksonJsonSerializer instead
      # double-encodes — the serializer would JSON-serialize the already-JSON byte[] as a base64 string.
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
    template:
      observation-enabled: true

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        endpoint: ${ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    io.github.temporalrift: INFO

server:
  address: 0.0.0.0
  port: ${PORT:8080}
